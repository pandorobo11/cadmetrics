[project]
name = "cadmetrics"
version = "0.8.0"
description = "CLI and Python API for CAD volume, surface area, and projected area metrics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "cadmetrics contributors" },
]
dependencies = [
  "numpy>=2.0",
  "rich>=13.7",
  "shapely>=2.0",
  "trimesh>=4.4",
  "typer>=0.12",
]

[project.optional-dependencies]
step = [
  "cadquery-ocp>=7.8",
]
gui = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
]
all = [
  "cadquery-ocp>=7.8",
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
]

[project.scripts]
cadmetrics = "cadmetrics.cli:app"
cadmetrics-gui = "cadmetrics.gui.pyside_app:main"

[dependency-groups]
dev = [
  "mkdocs>=1.6,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling", "mkdocs>=1.6,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = [
  "src/cadmetrics/api.py",
  "src/cadmetrics/coordinates.py",
  "src/cadmetrics/orientation.py",
  "src/cadmetrics/projection.py",
  "src/cadmetrics/sweep.py",
  "src/cadmetrics/types.py",
  "src/cadmetrics/units.py",
  "src/cadmetrics/gui/gui_formatters.py",
  "src/cadmetrics/gui/gui_types.py",
  "src/cadmetrics/gui/control_panel.py",
  "src/cadmetrics/gui/results_panel.py",
  "src/cadmetrics/gui/viewer.py",
  "src/cadmetrics/gui/model_loading.py",
  "src/cadmetrics/gui/calculation_controller.py",
  "src/cadmetrics/gui/pyside_app.py",
  "src/cadmetrics/gui/styles.py",
  "src/cadmetrics/gui/viewer_geometry.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
