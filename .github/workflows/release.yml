name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra step --group dev

      - name: Verify tag matches package version
        run: |
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Package HTML documentation
        run: |
          cd .hatch-build/cadmetrics-docs-site
          zip -r "../../dist/cadmetrics-docs-${GITHUB_REF_NAME}.zip" .

      - name: Smoke install wheel
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke
          /tmp/cadmetrics-smoke/bin/python -m pip install "$WHEEL"
          /tmp/cadmetrics-smoke/bin/cadmetrics --help

      - name: Smoke install step extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-step
          /tmp/cadmetrics-smoke-step/bin/python -m pip install "$WHEEL[step]"
          /tmp/cadmetrics-smoke-step/bin/cadmetrics inspect samples/unit_cube/unit_cube.step

      - name: Smoke install gui extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-gui
          /tmp/cadmetrics-smoke-gui/bin/python -m pip install "$WHEEL[gui]"
          /tmp/cadmetrics-smoke-gui/bin/python -c "import importlib.metadata as m; import cadmetrics.gui.pyside_app; [m.version(name) for name in ('PySide6', 'pyvista', 'pyvistaqt')]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/cadmetrics-docs-*.zip
          generate_release_notes: true
