name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra step --extra gui --group dev

      - name: Verify tag matches package version
        run: |
          VERSION="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check production modules
        run: uv run --no-sync mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest

      - name: Build package
        run: uv build

      - name: Package HTML documentation
        run: |
          cd .hatch-build/cadmetrics-docs-site
          zip -r "../../dist/cadmetrics-docs-${GITHUB_REF_NAME}.zip" .

      - name: Smoke install wheel
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke
          /tmp/cadmetrics-smoke/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/cadmetrics-smoke/bin/cadmetrics --help

      - name: Smoke install step extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-step
          /tmp/cadmetrics-smoke-step/bin/python -m pip install "$WHEEL[step]"
          cd /tmp
          /tmp/cadmetrics-smoke-step/bin/cadmetrics inspect "$GITHUB_WORKSPACE/samples/unit_cube/unit_cube.step"

      - name: Smoke install gui extra
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-gui
          /tmp/cadmetrics-smoke-gui/bin/python -m pip install "$WHEEL[gui]"
          cd /tmp
          /tmp/cadmetrics-smoke-gui/bin/python "$GITHUB_WORKSPACE/scripts/smoke_gui.py"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/cadmetrics-docs-*.zip
          generate_release_notes: true
