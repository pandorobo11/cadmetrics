name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --extra step --extra gui --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check core modules
        run: uv run mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Smoke install base wheel
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-base
          /tmp/cadmetrics-smoke-base/bin/python -m pip install "$WHEEL"
          /tmp/cadmetrics-smoke-base/bin/cadmetrics --help

      - name: Smoke install step extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-step
          /tmp/cadmetrics-smoke-step/bin/python -m pip install "$WHEEL[step]"
          /tmp/cadmetrics-smoke-step/bin/cadmetrics inspect samples/unit_cube/unit_cube.step

      - name: Smoke install gui extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-gui
          /tmp/cadmetrics-smoke-gui/bin/python -m pip install "$WHEEL[gui]"
          /tmp/cadmetrics-smoke-gui/bin/python -c "import importlib.metadata as m; import cadmetrics.gui.pyside_app; [m.version(name) for name in ('PySide6', 'pyvista', 'pyvistaqt')]"
