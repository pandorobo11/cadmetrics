name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# Cancel obsolete pull-request runs while keeping main and tag runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra step --extra gui --group dev

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check production modules
        run: uv run --no-sync mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Build package
        id: build
        run: uv build

      - name: Smoke install base wheel
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-base
          /tmp/cadmetrics-smoke-base/bin/python -m pip install "$WHEEL"
          /tmp/cadmetrics-smoke-base/bin/cadmetrics --help

      - name: Smoke install step extra
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-step
          /tmp/cadmetrics-smoke-step/bin/python -m pip install "$WHEEL[step]"
          /tmp/cadmetrics-smoke-step/bin/cadmetrics inspect samples/unit_cube/unit_cube.step

      - name: Smoke install gui extra
        # Validate GUI packaging even if an earlier smoke check failed.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          WHEEL="$(ls dist/cadmetrics-*.whl)"
          python -m venv /tmp/cadmetrics-smoke-gui
          /tmp/cadmetrics-smoke-gui/bin/python -m pip install "$WHEEL[gui]"
          /tmp/cadmetrics-smoke-gui/bin/python scripts/smoke_gui.py

      - name: Upload verified package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadmetrics-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

  clean-install:
    name: Clean install smoke
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Download verified package artifact
        uses: actions/download-artifact@v4
        with:
          name: cadmetrics-dist-${{ github.run_id }}
          path: dist

      - name: Install and exercise exact wheel outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          CLEAN_VENV="${RUNNER_TEMP}/cadmetrics-clean"
          WHEEL="$(find dist -maxdepth 1 -type f -name 'cadmetrics-*.whl' -print -quit)"
          test -n "${WHEEL}"
          uv venv --python 3.12 "${CLEAN_VENV}"
          uv pip install --python "${CLEAN_VENV}/bin/python" "${WHEEL}[step,gui]"
          cd "${RUNNER_TEMP}"
          "${CLEAN_VENV}/bin/cadmetrics" --help
          "${CLEAN_VENV}/bin/cadmetrics" inspect "${GITHUB_WORKSPACE}/samples/unit_cube/unit_cube.step"
          "${CLEAN_VENV}/bin/python" "${GITHUB_WORKSPACE}/scripts/smoke_gui.py"
